<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Block Puzzle - Simulation Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Sliding Block Puzzle</h1>
            <p>Interactive Search Algorithm Simulation</p>
        </header>

        <main>
            <div class="game-area">
                <div id="board" class="board">
                    <!-- Tiles injected by JS -->
                </div>
                
                <div class="controls panel">
                    <h2>Controls</h2>
                    <div class="button-group">
                        <button id="btn-bfs" class="btn primary">Solve with BFS</button>
                        <button id="btn-astar" class="btn primary">Solve with A*</button>
                    </div>
                    <div class="button-group">
                        <button id="btn-pause" class="btn secondary" style="display: none;">Pause Simulation</button>
                        <button id="btn-reset" class="btn secondary">Reset to Start</button>
                        <button id="btn-shuffle" class="btn secondary">Shuffle (Random Walk)</button>
                    </div>
                    <div id="status-message" class="status-message">Ready</div>
                </div>
            </div>

            <div class="metrics-area panel">
                <h2>Algorithm Performance</h2>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Expansions</div>
                        <div class="metric-value" id="metric-expansions">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Max Memory Nodes</div>
                        <div class="metric-value" id="metric-memory">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Moves Taken</div>
                        <div class="metric-value" id="metric-moves">-</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Time (s)</div>
                        <div class="metric-value" id="metric-time">-</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
