[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seminar-sliding-puzzle"
version = "0.1.0"
description = "Search-based solver for the Seminar Cognitive Systems 2 sliding block puzzle task."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Seminar Cognitive Systems" }
]
dependencies = []

[project.scripts]
sliding-puzzle = "sliding_puzzle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
